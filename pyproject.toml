[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "recordingcraft"
version = "0.1.0"
description = "Transcripcion y diarizacion de grabaciones de reuniones con WhisperX"
requires-python = ">=3.10"
dependencies = ["whisperx>=3.4.2"]

[project.scripts]
rc = "recordingcraft.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
