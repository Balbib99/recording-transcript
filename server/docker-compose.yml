services:
  api:
    build: .
    image: recordingcraft-api
    container_name: recordingcraft-api
    restart: unless-stopped
    env_file: .env

    # Solo loopback: el puerto NO queda expuesto a la red.
    # Es la unica forma fiable de cerrarlo, porque Docker escribe sus reglas
    # por delante de las de ufw y un "deny" del cortafuegos no le afecta.
    ports:
      - "127.0.0.1:8000:8000"

    # uid:gid de rcraft en la Pi, para que lo que se escriba en ./data
    # pertenezca a ese usuario y no a root.
    user: "1001:1001"

    # Carpeta de datos en el host. En la Pi: /srv/recordingcraft/data
    # (fuera del clon de git, para que un git clean nunca se lleve las grabaciones).
    volumes:
      - ${RC_DATA_HOST:-./data}:/data
      # La web, montada desde el disco: un cambio en la PWA se aplica con un
      # git pull, sin reconstruir la imagen. La imagen la lleva igualmente
      # copiada, para que funcione tambien sin este montaje.
      - ./web:/srv/web:ro
      # El codigo del servidor, tambien desde disco: desplegar pasa a ser un
      # git pull y un restart, sin recompilar dependencias en ARM.
      - ./app:/srv/app:ro

    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8000/api/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

    # Se une a la red "edge" para que Caddy pueda alcanzarla por nombre, igual
    # que hace con el resto de servicios. El puerto en loopback se mantiene
    # para el tunel SSH del worker.
    networks:
      edge:
        aliases:
          - recordingcraft-api

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # Mando a distancia: unico proceso capaz de mandar el paquete magico a la
  # red real, porque usa la red del host. No escucha en ningun puerto; recoge
  # las peticiones que la API deja en la carpeta de datos compartida.
  despertador:
    build: .
    image: recordingcraft-api
    container_name: recordingcraft-despertador
    restart: unless-stopped
    env_file: .env
    network_mode: host
    user: "1001:1001"
    command: ["python", "-m", "app.despertador"]
    volumes:
      - ${RC_DATA_HOST:-./data}:/data
      - ./app:/srv/app:ro
    depends_on:
      - api
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"

networks:
  edge:
    external: true
